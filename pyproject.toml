# ============================================================
# pyproject.toml (ALL-PY-REPOS)
# ============================================================
# Updated: 2026-10-06

# REQ: Python projects SHOULD include pyproject.toml as the single source of truth.
# WHY: Centralizes Python project configuration.

# ============================================================
# === SECTION 1: PROJECT IDENTITY ===
# ============================================================

[project]
name = "se-theory-structural-assurability" # Package distribution name (lowercase and dashes).
readme = "README.md"
requires-python = ">=3.15"
version = "0.4.1" # CUSTOM: Updated to match the current release version
license-files = ["LICENSE"]

# ============================================================
# === SECTION: PROJECT RUNTIME DEPENDENCIES ===
# ============================================================

dependencies = []

# ============================================================
# === SECTION: DEVELOPMENT AND DOCUMENTATION DEPENDENCIES ===
# ============================================================
# These packages support developing, testing, and documenting the project.
# They are not required to execute the project code.

[dependency-groups]
# WHY: Development and documentation tools support maintaining, validating,
#      and documenting the project without becoming runtime dependencies.

dev = [
    # REQ.DEV.DEPS: Standard tools for Python development and validation.
    "pytest",     # WHY: Run automated tests.
    "pytest-cov", # WHY: Measure and report test coverage.
    "ruff",       # WHY: Lint and format Python code.
    "ty",         # WHY: Check Python types using static analysis.
]

docs = [
    # REQ.DOCS.DEPS: Standard tools for generating project documentation.
    "mkdocstrings[python]", # WHY: Generate API documentation from Python docstrings.
    "zensical",             # WHY: Build the project documentation website.
]

# ============================================================
# SECTION 2: TOOL CONFIGURATION
# ============================================================

# === MARKDOWNLINT (MARKDOWN LINTING) ===

[tool.markdownlint]
MD033 = false # WHY: Allow inline HTML such as details, summary, iframe, and video.

# === UV (PYTHON ENVIRONMENT AND DEPENDENCY MANAGEMENT) ===

[tool.uv]
# WHY: Install all repository tooling with the canonical `uv sync`.
default-groups = "all"

# WHY: Give a bit of time to find hijacked releases before installing.
# CUSTOM: Should match `uvx prek update --freeze --cooldown-days 7`.
exclude-newer = "7 days"

# WHY: Repository tooling updates must be usable immediately.
exclude-newer-package = { se-theory-reference-kit = false }


# ============================================================
# SECTION 3: BUILD SYSTEM
# ============================================================
#
# REQ.PROJECT: A build system MUST be declared for package discovery and publishing.
# REQ.STRUCTURE: All importable code MUST live under src/.
# WHY src/ layout: Prevents accidental imports from the repo root and ensures
# consistent behavior across IDEs, tests, CI, and PyPI.

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.sdist]
include = [
    "src/se_theory_structural_assurability",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/se_theory_structural_assurability"]
