# ============================================================
# pyproject.toml (ALL-PY-REPOS)
# ============================================================
# Updated: 2026-09-27 prek

# REQ: Python projects SHOULD include pyproject.toml as the single source of truth.
# WHY: Centralizes Python project configuration.

# ============================================================
# === SECTION 1: PROJECT IDENTITY ===
# ============================================================

[project]
name = "se-theory-structural-assurability" # Package distribution name (lowercase and dashes).
readme = "README.md"
requires-python = ">=3.15"
version = "0.3.1"
license-files = ["LICENSE"]

dependencies = ["se-theory-reference-kit"]

[dependency-groups]
# WHY: Dependency groups separate development and documentation tools from project runtime dependencies.
dev = [
    # REQ: External packages used for linting, testing, type checking, etc.
    "prek",      # WHY: Run repository hooks for consistent formatting, linting, and checks.
    "pytest>=9", # WHY: Test framework for unit and integration tests.
    "pytest-cov", # WHY: Test coverage reporting for quality assurance.
    "ruff", # WHY: Fast linting and formatting for code quality and consistency.
    "ty", # WHY: Type checking for static analysis and bug prevention (replaces pyright).
]
docs = [
    # REQ: External packages used to generate project documentation.
    "mkdocstrings[python]", # WHY: Auto-generate API docs from docstrings.
    "zensical", # WHY: Generate and maintain project documentation.
]

# ============================================================
# SECTION 2: TOOL CONFIGURATION
# ============================================================

# === MARKDOWNLINT (MARKDOWN LINTING) ===

[tool.markdownlint]
MD033 = false # WHY: Allow inline HTML such as details, summary, iframe, and video.

# === PYTEST (VERIFY LOGIC) ===

[tool.pytest.ini_options]
# WHY: Consistent test discovery and coverage visibility.
minversion = "9.0"
testpaths = ["tests"]
addopts = "--cov=src --cov-fail-under=80 --cov-report=term-missing"
filterwarnings = [
    "ignore:FigureCanvasAgg is non-interactive, and thus cannot be shown:UserWarning",
]

# === RUFF (PYTHON FORMATTING AND LINTING) ===

# OBS: v0.16 formats Python in Markdown by default.

[tool.ruff.lint] # WHY: Extend Ruff's default rule set as needed.
extend-select = [
    # --- turn on for additional linting rules ---
    "D",  # WHY: Require docstrings; VS Code helps generate them.
]

[tool.ruff.lint.isort] # WHY: Sort plain-import and from-import lines together within each section.
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores] # WHY: Some file types need lint exceptions.
"src/**/__init__.py" = ["F401"] # Allow re-export patterns.
"src/**/_version.py" = ["ALL"]  # Auto-generated file; do not lint.
"tests/**/*.py" = ["D", "B018"] # Tests need no docstrings; B018 is default-on.
"notebooks/**/*.py" = ["D", "PLR1711", "RUF059"]   # marimo cells: bare returns + cell-scoped unused vars are the format, not defects

[tool.ruff.lint.pydocstyle] # WHY: Use Google docstring style when D is enabled.
convention = "google"

# === UV (PYTHON ENVIRONMENT AND DEPENDENCY MANAGEMENT) ===

[tool.uv]
# WHY: Install all repository tooling with the canonical `uv sync`.
default-groups = "all"

# WHY: Give a bit of time to find hijacked releases before installing.
# CUSTOM: Should match `uv run prek update --freeze --cooldown-days 7`.
exclude-newer = "7 days"

# WHY: Repository tooling updates must be usable immediately.
exclude-newer-package = { se-theory-reference-kit = false }


# ============================================================
# SECTION 3: BUILD SYSTEM
# ============================================================
#
# REQ.PROJECT: A build system MUST be declared for package discovery and publishing.
# REQ.STRUCTURE: All importable code MUST live under src/.
# WHY src/ layout: Prevents accidental imports from the repo root and ensures
# consistent behavior across IDEs, tests, CI, and PyPI.

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.sdist]
include = [
    "src/se_theory_structural_assurability",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/se_theory_structural_assurability"]
