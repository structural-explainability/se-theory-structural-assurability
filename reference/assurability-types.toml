[type.EvidenceAccessModel]
id = "EvidenceAccessModel"
name = "Evidence access model"
lean_symbol = "SE.StructuralAssurability.EvidenceAccessModel"
source_module = "SE.StructuralAssurability.Layer20_Semantics.Accessibility"
