[type.SufficiencyStandard]
id = "SufficiencyStandard"
name = "Sufficiency standard"
lean_symbol = "SE.StructuralAssurability.SufficiencyStandard"
source_module = "SE.StructuralAssurability.Layer20_Semantics.Sufficiency"
