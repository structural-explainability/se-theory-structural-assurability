namespace = "SE.StructuralAssurability"

# ============================================================
# === FOUNDATION ===
# ============================================================

[type.WorldSpace]
id = "WorldSpace"
name = "World space"
lean_symbol = "SE.StructuralAssurability.WorldSpace"
source_module = "SE.StructuralAssurability.Layer10_Foundation.World"
description = "A collection of possible worlds together with the predicate identifying those admitted by the analysis."

[type.Claim]
id = "Claim"
name = "Claim"
lean_symbol = "SE.StructuralAssurability.Claim"
source_module = "SE.StructuralAssurability.Layer10_Foundation.Claim"
description = "A proposition evaluated over possible worlds."

[type.EvidenceSet]
id = "EvidenceSet"
name = "Evidence set"
lean_symbol = "SE.StructuralAssurability.EvidenceSet"
source_module = "SE.StructuralAssurability.Layer10_Foundation.Evidence"
description = "A set of evidence artifacts."

[type.EvaluatorConditions]
id = "EvaluatorConditions"
name = "Evaluator conditions"
lean_symbol = "SE.StructuralAssurability.EvaluatorConditions"
source_module = "SE.StructuralAssurability.Layer10_Foundation.Evaluator"
description = "Knowledge, access, trust, cooperation, and evaluator information relevant to evidence acquisition."

[type.ComparativeContext]
id = "ComparativeContext"
name = "Comparative assurance context"
lean_symbol = "SE.StructuralAssurability.ComparativeContext"
source_module = "SE.StructuralAssurability.Layer10_Foundation.Context"
